name: Release

on:
  push:
    tags:
      - 'v*'

# Re-pushing the same tag cancels the in-flight run instead of racing it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Guard: the tag must match package.json, otherwise the artifacts
      # (named from package.json) would not match the tagged version.
      - name: Verify tag matches package.json version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME (version $TAG_VERSION) does not match package.json version $PKG_VERSION." >&2
            echo "Bump package.json (and CHANGELOG.md) first, then re-tag." >&2
            exit 1
          fi
          echo "APP_VERSION=$PKG_VERSION" >> "$GITHUB_ENV"

      # Sanity gates — same as CI, must pass before we bother packaging
      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The two vendored binaries are gitignored, so a clean checkout has neither
      # — and build.extraResources points straight at them. Both scripts verify a
      # pinned SHA-256 and exit non-zero on any mismatch.
      - name: Vendor pinned binaries (Wintun driver + transmission engine)
        run: |
          node scripts/fetch-wintun.mjs
          node scripts/fetch-transmission.mjs

      - name: Package (electron-builder)
        run: npx electron-builder --win --publish never
        env:
          # Runners have no signing certificate — don't try to discover one
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # electron-builder does NOT fail when an extraResources source is missing:
      # it logs "file source doesn't exist" and exits 0. Without this gate the
      # whole pipeline stays green while producing an installer whose LAN reports
      # "unavailable on this build" and whose torrent engine is absent — a defect
      # nothing else here can catch, because CI never packages.
      - name: Verify the package carries its native resources
        shell: bash
        run: |
          missing=0
          for f in \
            "release/win-unpacked/resources/wintun/wintun.dll" \
            "release/win-unpacked/resources/wintun/prebuilt-binaries-license.txt" \
            "release/win-unpacked/resources/engine/transmission-daemon.exe"
          do
            if [ ! -f "$f" ]; then echo "MISSING from the package: $f" >&2; missing=1; fi
          done
          [ "$missing" = 0 ] || { echo "Refusing to publish a package with missing native resources." >&2; exit 1; }
          echo "native resources present."

      - name: Extract release notes from CHANGELOG.md
        shell: bash
        run: node scripts/changelog-section.js > release-notes.md

      # DRAFT release — a human reviews it and presses Publish on GitHub
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          name: Havvn ${{ env.APP_VERSION }}
          body_path: release-notes.md
          files: |
            release/Havvn-Setup-*.exe
            release/Havvn-Setup-*.exe.blockmap
            release/latest.yml
            release/Havvn-*-win-portable.zip
