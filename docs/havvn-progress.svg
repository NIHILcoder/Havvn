"/><text x="358" y="143" text-anchor="middle" fill="#edf4fc">6</text><rect x="393" y="152" width="42" height="228" rx="3" fill="#9ed4ff"/><text x="414" y="143" text-anchor="middle" fill="#edf4fc">6</text><text x="387" y="411" text-anchor="middle" fill="#c1cbd7" font-size="13">Персонализация · PER</text><rect x="544" y="152" width="42" height="228" rx="3" fill="#536475"/><text x="565" y="143" text-anchor="middle" fill="#edf4fc">6</text><rect x="600" y="152" width="42" height="228" rx="3" fill="#9ed4ff"/><text x="621" y="143" text-anchor="middle" fill="#edf4fc">6</text><text x="594" y="411" text-anchor="middle" fill="#c1cbd7" font-size="13">Оптимизация · OPT</text><rect x="751" y="266" width="42" height="114" rx="3" fill="#536475"/><text x="772" y="257" text-anchor="middle" fill="#edf4fc">3</text><rect x="807" y="228" width="42" height="152" rx="3" fill="#9ed4ff"/><text x="828" y="219" text-anchor="middle" fill="#edf4fc">4</text><text x="801" y="411" text-anchor="middle" fill="#c1cbd7" font-size="13">Функции · FUN</text><text x="496" y="440" fill="#aebac9" font-size="12" text-anchor="middle">Направление плана</text><line x1="40" x2="940" y1="461" y2="461" stroke="#29313c"/><text x="40" y="486" fill="#edf4fc">Открыто: FUN-01 — внешняя приёмка; FUN-06 — исследование сопряжения.</text><text x="40" y="512" fill="#aebac9" font-size="12">Счётчик отражает заявленный локальный объём, а не готовность релиза. Native-предзагрузка не выпущена.</text><text x="40" y="538" fill="#aebac9" font-size="12">OPT-02: базовый UI-стенд. OPT-04: очередь подготовки файлов. Аппаратные и сетевые проверки остаются.</text><text x="40" y="569" fill="#7f90a4" font-size="11">Источник: docs/havvn-implementation-plan.md и документы приёмки · снимок 23–26 октября 2026</text></g></svg>